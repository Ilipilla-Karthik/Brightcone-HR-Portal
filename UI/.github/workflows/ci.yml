name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: API types are up to date with openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run lint
      - name: Project structure (400-line limit, naming, unused CSS, dead code)
        run: npm run check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Playwright smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
